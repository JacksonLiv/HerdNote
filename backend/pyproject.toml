[project]
name = "pentestreportmaker-api"
version = "0.1.0"
description = "USF CyberHerd engagement tracker — API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "argon2-cffi==23.1.0",
    "cryptography==44.0.0",
    "python-multipart==0.0.20",
    "itsdangerous==2.2.0",
    "lxml==5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "httpx==0.28.1",
    "aiosqlite==0.20.0",
    "ruff==0.8.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic migrations are autogenerated boilerplate.
extend-exclude = ["app/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Query() in defaults is the intended idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# conftest sets env vars before importing the app — imports must follow.
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
